apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: twyn-api
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 20
      timeoutSeconds: 900
      serviceAccountName: twyn-api@ultimate-rig-513313-j5.iam.gserviceaccount.com
      containers:
        - image: REPLACE_WITH_ARTIFACT_REGISTRY_IMAGE
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
          env:
            - name: PORT
              value: "8080"
            - name: ALLOW_DEV_LOGIN
              value: "0"
            - name: DB_POOL_SIZE
              value: "2"
            - name: DB_MAX_OVERFLOW
              value: "2"
            - name: UPLOAD_DIR
              value: /tmp/twyn-uploads
